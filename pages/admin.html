<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administración | Control laboral</title><link rel="stylesheet" href="../assets/css/main.css"></head>
<body class="app-body" data-page="admin"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><div class="app-view"><header id="app-header" class="topbar"></header><main id="app-content" class="content">
<section class="page-heading"><div><p class="eyebrow">Administración</p><h1>Equipo y rendimiento</h1><p class="muted">Una visión rápida del estado operativo.</p></div><a class="button button-primary" href="tasks.html">Asignar tarea</a></section><section id="admin-metrics" class="metrics-grid"></section>
<section class="two-columns admin-columns"><article class="panel"><div class="panel-heading"><div><p class="eyebrow">Personal</p><h2>Equipo activo</h2></div><button class="text-button" id="add-employee" type="button">Añadir empleado</button></div><div id="employees-list" class="employee-list"></div></article><article class="panel"><div class="panel-heading"><div><p class="eyebrow">Seguimiento</p><h2>Entregas recientes</h2></div><a href="tasks.html">Gestionar</a></div><div id="admin-tasks" class="compact-list"></div></article></section>
<section class="panel projects-panel"><div class="panel-heading"><div><p class="eyebrow">Proyectos</p><h2>Portafolio activo</h2></div><button class="text-button" id="add-project" type="button">Crear proyecto</button></div><div id="projects-list" class="projects-list"></div></section>
<dialog id="employee-dialog" class="modal"><form id="employee-form" method="dialog"><div class="modal-heading"><div><p class="eyebrow">Personal</p><h2>Registrar empleado</h2></div><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><div class="form-grid"><div class="form-field full"><label for="employee-name">Nombre completo</label><input id="employee-name" required></div><div class="form-field"><label for="employee-position">Cargo</label><input id="employee-position" required></div><div class="form-field"><label for="employee-code">Código</label><input id="employee-code" required placeholder="EM0040"></div><div class="form-field"><label for="employee-pin">PIN</label><input id="employee-pin" inputmode="numeric" minlength="4" required></div></div><div class="modal-actions"><button class="button button-secondary" value="cancel">Cancelar</button><button class="button button-primary" value="default">Guardar empleado</button></div></form></dialog>
<dialog id="project-dialog" class="modal"><form id="project-form" method="dialog"><div class="modal-heading"><div><p class="eyebrow">Portafolio</p><h2>Crear proyecto</h2></div><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><div class="form-grid"><div class="form-field full"><label for="project-name">Nombre del proyecto</label><input id="project-name" required></div><div class="form-field full"><label for="project-area">Área o departamento</label><input id="project-area" required></div></div><div class="modal-actions"><button class="button button-secondary" value="cancel">Cancelar</button><button class="button button-primary" value="default">Guardar proyecto</button></div></form></dialog>
</main></div></div><script type="module" src="../assets/js/admin.js"></script></body></html>
