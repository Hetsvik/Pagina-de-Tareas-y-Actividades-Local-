<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tareas | Control laboral</title><link rel="stylesheet" href="../assets/css/main.css"></head>
<body class="app-body" data-page="tasks"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><div class="app-view"><header id="app-header" class="topbar"></header><main id="app-content" class="content">
<section class="page-heading"><div><p class="eyebrow">Plan de trabajo</p><h1 id="tasks-title">Mis tareas</h1><p class="muted">Actualiza el avance y mantén al equipo informado.</p></div><button id="open-task-form" class="button button-primary" type="button">Nueva tarea</button></section>
<section class="filter-bar" aria-label="Filtros de tareas"><button class="filter-button is-active" data-filter="all" type="button">Todas</button><button class="filter-button" data-filter="Asignada" type="button">Asignadas</button><button class="filter-button" data-filter="En Progreso" type="button">En progreso</button><button class="filter-button" data-filter="Enviar a Revisión" type="button">En revisión</button><button class="filter-button" data-filter="Completada" type="button">Completadas</button></section><section id="tasks-list" class="task-grid" aria-live="polite"></section>
<dialog id="task-dialog" class="modal"><form id="task-form" method="dialog"><div class="modal-heading"><div><p class="eyebrow">Nueva asignación</p><h2>Crear tarea</h2></div><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><div class="form-grid"><div class="form-field"><label for="task-project">Proyecto</label><input id="task-project" required placeholder="Nombre del proyecto"></div><div id="assignee-field" class="form-field"><label for="task-assignee">Asignar a</label><select id="task-assignee"></select></div><div class="form-field full"><label for="task-description">Descripción</label><textarea id="task-description" required rows="3" placeholder="Describe el resultado esperado"></textarea></div><div class="form-field"><label for="task-deadline">Fecha límite</label><input id="task-deadline" type="datetime-local"></div><div class="form-field"><label for="task-priority">Prioridad</label><select id="task-priority"><option>Alta</option><option selected>Media</option><option>Baja</option></select></div></div><div class="modal-actions"><button class="button button-secondary" value="cancel">Cancelar</button><button class="button button-primary" value="default">Guardar tarea</button></div></form></dialog>
</main></div></div><script type="module" src="../assets/js/tasks.js"></script></body></html>
